name: newpipeextractor_dart
description: >
  Flutter plugin wrapping NewPipe Extractor for YouTube data extraction.
  Extract video info, streams, subtitles, comments, channels, playlists,
  search results, and trending content — no API key required.
publish_to: none
version: 1.0.0
homepage: https://github.com/OttomanDeveloper/NewPipeExtractor_Dart.git
repository: https://github.com/OttomanDeveloper/NewPipeExtractor_Dart.git
issue_tracker: https://github.com/OttomanDeveloper/NewPipeExtractor_Dart/issues

environment:
    sdk: ">=3.0.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter
    http: any
    html: any
    flutter_inappwebview: ^6.1.5
    freezed_annotation: ^2.4.0
    json_annotation: ^4.9.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    pigeon: ^22.7.0
    freezed: ^2.5.0
    json_serializable: ^6.8.0
    build_runner: ^2.4.0

flutter:
    plugin:
        platforms:
            android:
                package: com.ottomancoder.newpipeextractor_dart
                pluginClass: NewpipeextractorDartPlugin
